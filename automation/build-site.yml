name: Build site
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/build-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pages, sitemap and daily content
        run: |
          python3 tools/build.py
          python3 tools/refresh.py
      - name: Commit generated site
        run: |
          git config user.name "new-vision-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "build: regenerate site"
          git push
