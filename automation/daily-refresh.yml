name: Daily content refresh
on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rotate daily prompt, affirmation, featured guide & video
        run: python3 tools/refresh.py
      - name: Commit changes
        run: |
          git config user.name "new-vision-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily.json sitemap.xml
          git diff --cached --quiet || git commit -m "chore: daily refresh $(date -u +%F)"
          git push
